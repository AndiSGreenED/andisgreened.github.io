name: Tests

on:
  push:
    paths:
      - "docs/index.html"
      - "docs/datenschutz.html"
      - "docs/manifest.webmanifest"
      - "docs/spot-updates.json"
      - "docs/sw.js"
      - "apk/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "docs/index.html"
      - "docs/datenschutz.html"
      - "docs/manifest.webmanifest"
      - "docs/spot-updates.json"
      - "docs/sw.js"
      - "apk/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: node --test scripts/*.test.mjs
