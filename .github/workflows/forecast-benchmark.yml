name: Forecast benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forecast-benchmark.yml"
      - "scripts/forecast-benchmark.mjs"
      - "scripts/forecast-benchmark.test.mjs"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: forecast-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore pending state from the latest run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .benchmark
          RUN_ID="$(gh run list --workflow forecast-benchmark.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "${RUN_ID}" ]; then
            gh run download "${RUN_ID}" --name forecast-benchmark-pending --dir .benchmark
          fi
      - name: Run aggregate benchmark
        run: node scripts/forecast-benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-benchmark-pending
          path: .benchmark/forecast-benchmark-pending.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish aggregate results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/forecast-benchmark.json
          if git diff --cached --quiet; then
            echo "No benchmark changes to publish."
          else
            git commit -m "Update aggregate forecast benchmark"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying after syncing with main."
              sleep 2
            done
            echo "Could not publish benchmark results after 3 attempts." >&2
            exit 1
          fi
